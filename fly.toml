# fly.toml app configuration file generated for adsgame on 2026-10-14T01:26:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'adsgame'
primary_region = 'ams'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  HOSTING_PROVIDER = 'Fly.io'
  NODE_ENV = 'production'
  PAYMENT_PROVIDER = 'toss'
  PORT = '8080'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'ad_dodge_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
