# Fly.io 배포 설정 — 실제 배포(fly launch/deploy)는 계정이 필요하므로 사람이 한다. 절차: README "배포 — 컨테이너·Fly.io"
#
# ⚠ 단일 인스턴스 전용: 장부가 볼륨 위의 JSON 파일 하나(db.json)라 머신을 2대 이상 띄우면 장부가 갈라진다.
#   `fly scale count 2` 같은 수평 확장 금지. 볼륨도 하나만 만든다.
#
# 비밀값(ADMIN_TOKEN·TOSS_SECRET_KEY·GOOGLE_VISION_API_KEY·BIZ_* 사업자 정보)은 여기에 적지 않고
#   `fly secrets set 이름=값` 으로만 넣는다.

app = "ad-dodge-CHANGE-ME"   # 사람이 정한다(fly apps create 이름)
primary_region = "nrt"       # 도쿄 — 한국에서 가장 가까운 리전

kill_signal = "SIGTERM"      # 받으면 밀린 놀이 기록을 디스크에 쓰고 종료(server/shutdown.js)
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  DATA_DIR = "/data"
  # fly 프록시가 X-Forwarded-For 끝에 실제 접속 IP를 붙인다 — 프록시 한 단 뒤이므로 1(server/app.js clientIp)
  TRUST_PROXY = "1"
  PAYMENT_PROVIDER = "toss"  # 운영 모드에서 mock 은 시작 거부
  HOSTING_PROVIDER = "Fly.io"

# 영구 볼륨 — 장부(db.json)·업로드 로고·백업이 여기 산다. 먼저 `fly volumes create ad_dodge_data --region nrt --size 1`
[mounts]
  source = "ad_dodge_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true           # http 로 들어오면 https 로 돌려보낸다
  auto_stop_machines = "off"   # SSE(실시간 배너) 연결이 있고 장부를 메모리에 들고 있어서 멈추지 않는다
  auto_start_machines = true
  min_machines_running = 1     # 단일 인스턴스 — 1대만

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  # 장부를 실제로 읽을 수 있어야 통과(server/health.js). 실패하면 fly 가 트래픽을 끊고 알린다
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
